# Local OpenLeague stack for a test machine: PostgreSQL, a one-shot migration
# job, the app, and Caddy for HTTPS.
#
#   1. Fill in .env.local (NEXTAUTH_SECRET of 32+ chars, SMTP_*, EMAIL_FROM)
#   2. docker compose up -d --build
#   3. Open https://localhost
#
# .env.local is passed to the app as-is, except for the values set under
# `environment:` below, which win: the database always points at the bundled
# PostgreSQL and the URL is https://localhost (Caddy), whatever .env.local says
# for `bun run dev`. The database credentials are fixed test values; its port
# is bound to loopback only.

x-app-image: &app-image
  image: openleague-app
  build: .

x-database-url: &database-url postgresql://openleague:openleague@db:5432/openleague

name: openleague

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openleague
      POSTGRES_PASSWORD: openleague
      POSTGRES_DB: openleague
    volumes:
      - db-data:/var/lib/postgresql/data
    # Loopback only, for Prisma Studio / psql / `bun run dev` from the host.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openleague -d openleague"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies prisma/migrations, then exits; the app waits for it to succeed.
  migrate:
    <<: *app-image
    command: ["bun", "run", "db:migrate:deploy"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *app-image
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      DATABASE_URL: *database-url
      NEXTAUTH_URL: https://localhost
    depends_on:
      migrate:
        condition: service_completed_successfully

  # In production proxy.ts redirects any request without
  # `X-Forwarded-Proto: https`, so the app is only reachable through Caddy.
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: https://localhost
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  caddy-data:
  caddy-config:
